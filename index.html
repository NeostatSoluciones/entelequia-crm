<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B2A4A">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>CLOSER · Entelequia</title>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2A4A;       /* azul marino profundo del wordmark */
  --navy2:#103A63;
  --acero:#4D677B;      /* acero medio */
  --acero2:#5E778B;
  --plata:#95AFC2;      /* azul plateado claro */
  --plata2:#BFD7E8;
  --azul:#2E6FB0;       /* azul brillante de acento */
  --azul2:#3F86CE;
  --hielo:#EEF3F8;      /* fondo gris-azulado claro (oficina) */
  --hielo2:#E2EAF2;
  --tinta:#0C1B2A;
  --t2:#3A4A5A;
  --t3:#6B7C8C;
  --t4:#9AA9B7;
  --linea:#DCE5EE;
  --linea2:#C6D3E0;
  --blanco:#FFFFFF;
  --okbg:#E3EFF9;
  --rojo:#C2483A;
  --ok:#2E7D52;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--hielo);color:var(--tinta);
  font-size:15px;line-height:1.45;padding-bottom:84px;
}
h1,h2,h3,.disp{font-family:'Saira',sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
.hidden{display:none!important}

/* ── topbar ── */
.top{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:10px}
.top .ico{width:30px;height:30px;border-radius:7px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.top .brand{font-family:'Saira';font-weight:800;font-size:18px;letter-spacing:3px}
.top .who{margin-left:auto;font-size:12px;color:var(--plata2);font-weight:600;display:flex;align-items:center;gap:8px}
.top .who button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:600;cursor:pointer}

/* ── cards / sections ── */
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(11,42,74,.04)}
.card.accent{border-color:var(--azul);border-width:1.5px}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 60%,var(--acero) 140%);border:none;color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(63,134,206,.35),transparent 70%)}
.eyebrow{font-family:'Saira';font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--azul);margin-bottom:4px}
.hero .eyebrow{color:var(--plata2)}
.h-title{font-family:'Saira';font-weight:800;font-size:22px;line-height:1.12;margin:0 0 3px;letter-spacing:.3px}
.h-sub{font-size:13px;color:var(--t3);margin:0}
.hero .h-sub{color:var(--plata2)}
.sec-t{font-family:'Saira';font-weight:700;font-size:14px;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:7px;letter-spacing:.4px}

/* ── fields ── */
.fld{margin-bottom:12px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:5px}
.inp{width:100%;border:1.5px solid var(--linea2);border-radius:11px;padding:12px 13px;font-size:15px;font-family:inherit;background:#fff;color:var(--tinta);outline:none;transition:border .15s}
.inp:focus{border-color:var(--azul)}
.inp::placeholder{color:var(--t4)}
textarea.inp{resize:vertical;min-height:88px;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:700;font-family:'Saira';letter-spacing:.4px;cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.985)}
.btn-p{background:var(--azul);color:#fff}
.btn-p:hover{filter:brightness(1.05)}
.btn-v{background:var(--navy);color:#fff}
.btn-o{background:#fff;color:var(--navy);border:1.5px solid var(--linea2)}
.btn-g{background:var(--ok);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-sm{padding:9px 13px;font-size:12px;width:auto;border-radius:9px}

/* ── chips ── */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--okbg);color:var(--navy)}
.chip.blue{background:#DCEAF7;color:var(--azul)}

/* ── catalog product rows ── */
.prod{display:flex;gap:11px;align-items:center;padding:11px;border:1.5px solid var(--linea);border-radius:12px;margin-bottom:8px;background:#fff}
.prod .pinfo{flex:1;min-width:0}
.prod .psku{font-family:'Saira';font-weight:700;font-size:14px;color:var(--navy)}
.prod .pname{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod .pprice{font-size:13px;color:var(--t2);font-weight:600;margin-top:2px}
.prod .padd{background:var(--azul);color:#fff;border:none;width:42px;height:42px;border-radius:11px;font-size:22px;font-weight:800;cursor:pointer;flex-shrink:0}

/* ── cart ── */
.cartitem{display:flex;gap:10px;align-items:center;padding:11px;border:1.5px solid var(--linea);border-radius:12px;margin-bottom:7px;background:#fff}
.cartitem .ci-info{flex:1;min-width:0}
.cartitem .ci-sku{font-family:'Saira';font-weight:700;font-size:13px;color:var(--navy)}
.cartitem .ci-meta{font-size:11px;color:var(--t3)}
.cartitem .ci-total{font-family:'Saira';font-weight:700;font-size:15px;color:var(--tinta)}
.cartitem .ci-x{background:#FBEBE8;border:1.5px solid var(--rojo);color:var(--rojo);width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;flex-shrink:0}

/* ── totals ── */
.totals{background:var(--navy);border-radius:14px;padding:16px;color:#fff;margin-top:10px}
.totals .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.totals .row .lab{font-size:12px;color:var(--plata2)}
.totals .row .val{font-size:13px;font-weight:600;color:#fff}
.totals .grand{border-top:1px solid rgba(149,175,194,.35);padding-top:9px;margin-top:7px}
.totals .grand .lab{font-family:'Saira';font-size:13px;font-weight:700;color:var(--plata2)}
.totals .grand .val{font-family:'Saira';font-size:28px;font-weight:800;color:#fff}
.ship{margin-top:10px;background:var(--azul);color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px;text-align:center}
.ship.miss{background:rgba(255,255,255,.1);color:var(--plata2)}

/* ── unit toggle ── */
.unitsel{display:flex;gap:6px;margin:6px 0}
.unitsel button{flex:1;padding:9px;border:1.5px solid var(--linea2);background:#fff;border-radius:9px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;font-family:'Saira'}
.unitsel button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── metrics ── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1.5px solid var(--linea);border-radius:14px;padding:14px}
.kpi .kn{font-family:'Saira';font-size:26px;font-weight:800;color:var(--navy);line-height:1}
.kpi .kl{font-size:11px;color:var(--t3);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.kpi.blue .kn{color:var(--azul)}

/* ── bottom nav ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid var(--linea);display:flex;padding:6px 4px 8px;box-shadow:0 -2px 12px rgba(11,42,74,.06)}
.nav .tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;color:var(--t4);font-family:'Saira'}
.nav .tab .ti{font-size:20px;line-height:1}
.nav .tab .tl{font-size:10px;font-weight:600}
.nav .tab.on{color:var(--azul)}

/* ── login ── */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--navy);padding:24px;text-align:center;background-image:radial-gradient(circle at 50% 20%,rgba(63,134,206,.18),transparent 55%)}
.login .logoimg{width:min(86vw,380px);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.4);margin-bottom:26px}
.login .tag{color:var(--plata2);font-size:12px;margin:-12px 0 26px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.login .users{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.uchip{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);border-radius:14px;padding:14px 18px;cursor:pointer;color:#fff;min-width:130px;transition:all .15s}
.uchip.on{background:var(--azul);border-color:var(--azul2)}
.uchip .un{font-family:'Saira';font-weight:700;font-size:15px}
.uchip .ur{font-size:11px;opacity:.8;margin-top:2px}
.pinbox{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.2);border-radius:14px;color:#fff;font-size:24px;letter-spacing:14px;text-align:center;padding:14px;width:210px;font-family:'Saira';font-weight:700}
.pinbox::placeholder{letter-spacing:5px;font-size:14px;opacity:.5}

/* ── toast ── */
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:200;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--rojo)}
#toast.ok{background:var(--ok)}

/* ── modal ── */
.modal{position:fixed;inset:0;background:rgba(11,42,74,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px 18px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h3{font-family:'Saira';margin:0 0 14px;color:var(--navy);font-size:18px}

.flip{width:100%;height:72vh;border:1px solid var(--linea);border-radius:14px;background:#fff}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:30px 14px;color:var(--t3)}
.empty .ei{font-size:36px;margin-bottom:8px}
</style>
</head>
<body>

<!-- ════ LOGIN ════ -->
<div id="login" class="login">
  <img class="logoimg" id="loginLogo" alt="CLOSER">
  <div class="tag">Cierra más rápido</div>
  <div class="users" id="users"></div>
  <input id="pin" class="pinbox" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" oninput="if(this.value.length===4)doLogin()">
  <div style="margin-top:18px"><button class="btn btn-p" style="width:210px" onclick="doLogin()">Entrar</button></div>
  <div id="loginErr" style="color:#9FC2E0;font-size:12px;margin-top:14px;height:16px"></div>
</div>

<!-- ════ APP ════ -->
<div id="app" class="hidden">
  <div class="top">
    <img class="ico" id="topIcon" alt="">
    <div class="brand">CLOSER</div>
    <div class="who"><span id="whoName"></span><button onclick="logout()">Salir</button></div>
  </div>
  <div class="wrap" id="view"></div>
</div>

<nav class="nav hidden" id="nav"></nav>
<div id="toast"></div>

  {id:'Eli',nombre:'Elizabeth Hernández',pin:'2024',role:'vendedor'},
  {id:'Christian',nombre:'Christian López',pin:'2741',role:'admin'}
];
const CATALOGO_URL='https://heyzine.com/flip-book/cb62621c0b.html';

let S={
  u:null, v:'cotizar', loginUser:'Eli',
  cos:[], cosLoaded:false, qs:'',
  cart:[], cliente:{neg:'',con:'',tel:'',email:'',rfc:''},

/* ── api ── */
async function gf(a,extra=''){
  try{const r=await fetch(API+'?action='+a+extra,{redirect:'follow'});return await r.json();}
  catch(e){return null;}
}
async function pf(d){
  try{
    const r=await fetch(API,{method:'POST',body:JSON.stringify(d),headers:{'Content-Type':'text/plain;charset=utf-8'}});
    const j=await r.json();
    if(j&&j.ok===false&&j.error) toast('⚠️ '+j.error,'err');
    return j;
  }catch(e){toast('⚠️ Sin conexión — reintenta','err');return null;}
}
function toast(m,t=''){const e=document.getElementById('toast');e.textContent=m;e.className='show '+t;clearTimeout(e._t);e._t=setTimeout(()=>e.className='',2600);}
function money(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* ── login ── */
function renderUsers(){
  document.getElementById('users').innerHTML=AGENTES.map(a=>
    `<div class="uchip ${S.loginUser===a.id?'on':''}" onclick="pickUser('${a.id}')">
      <div class="un">${a.nombre.split(' ')[0]}</div>
      <div class="ur">${a.role==='admin'?'Supervisor':'Vendedora'}</div>
    </div>`).join('');
}
function pickUser(id){S.loginUser=id;renderUsers();document.getElementById('pin').focus();}
function doLogin(){
  const pin=document.getElementById('pin').value.trim();
  const a=AGENTES.find(x=>x.id===S.loginUser);
  if(!a)return;
  if(pin!==a.pin){document.getElementById('loginErr').textContent='PIN incorrecto';document.getElementById('pin').value='';return;}
  S.u=a;
  localStorage.setItem('closer_user',a.id);
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('nav').classList.remove('hidden');
  document.getElementById('whoName').textContent=a.nombre.split(' ')[0];
  S.v = a.role==='admin' ? 'metricas' : 'cotizar';
  loadCatalogo();
  R();
}
function logout(){S.u=null;localStorage.removeItem('closer_user');document.getElementById('app').classList.add('hidden');document.getElementById('nav').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('pin').value='';document.getElementById('loginErr').textContent='';}

async function loadCatalogo(){
  if(S.cosLoaded)return;
  const r=await gf('costos');
  if(r&&r.ok&&r.productos){S.cos=r.productos;S.cosLoaded=true;if(S.v==='cotizar')R();}
}

/* ── nav ── */
function renderNav(){
  const isA=S.u&&S.u.role==='admin';
  const tabs=[
    {k:'cotizar',i:'🧾',l:'Cotizar'},
    {k:'carta',i:'✉️',l:'Carta'},
    {k:'catalogo',i:'📖',l:'Catálogo'},
    {k:'notas',i:'📝',l:'Notas'},
    {k:'metricas',i:'📊',l:isA?'Equipo':'Mi avance'}
  ];
  document.getElementById('nav').innerHTML=tabs.map(t=>
    `<button class="tab ${S.v===t.k?'on':''}" onclick="go('${t.k}')">
      <span class="ti">${t.i}</span><span class="tl">${t.l}</span>
    </button>`).join('');
}
function go(v){S.v=v;if(v==='metricas')loadMetricas();if(v==='cotizar'&&!S.cosLoaded)loadCatalogo();R();}

function R(){
  if(!S.u)return;
  renderNav();
  const v=document.getElementById('view');
  v.innerHTML =
    S.v==='cotizar' ? cotizarH() :
    S.v==='carta'   ? cartaH()   :
    S.v==='catalogo'? catalogoH():
    S.v==='notas'   ? notasH()   :
    S.v==='metricas'? metricasH(): '';
  window.scrollTo(0,0);
}

function cotizarH(){
  const c=S.cliente;

  return `

      <input class="inp" id="qrfc" value="${esc(c.rfc)}" oninput="S.cliente.rfc=this.value.toUpperCase()" maxlength="13" style="text-transform:uppercase" placeholder="XAXX010101000"></div>

    <div class="sec-t">📦 Catálogo · ${S.cosLoaded?S.cos.length:'…'} productos</div>
    ${!S.cosLoaded?`<div class="empty">Cargando catálogo…</div>`:`
    <input class="inp" placeholder="🔍 Buscar SKU o nombre…" value="${esc(S.qs)}" oninput="S.qs=this.value;updateProdList()" style="margin-bottom:10px">
    <div id="prodlist" style="max-height:440px;overflow-y:auto">${prodListH(prods)}</div>`}
  </div>`;
}
function prodListH(prods){
  if(!prods.length)return `<div class="empty">Sin resultados</div>`;
  return prods.slice(0,120).map(p=>{
    const tieneNombre=p.producto&&p.producto!==p.sku;
    const sub=[p.sku, p.medida, p.material].filter(Boolean).join(' · ');
    return `
    <div class="prod">
      <div class="pinfo">
        <div class="psku">${esc(tieneNombre?p.producto:p.sku)}</div>
        ${tieneNombre?`<div class="pname">${esc(sub)}</div>`:(p.medida||p.material?`<div class="pname">${esc([p.medida,p.material].filter(Boolean).join(' · '))}</div>`:'')}
        <div class="pprice">Caja ${money(p.precio_caja)}${p.precio_paq>0?` · Paq ${money(p.precio_paq)}`:''}</div>
      </div>
      <button class="padd" onclick="abrirAgregar('${esc(p.sku)}')">+</button>
    </div>`;}).join('') + (prods.length>120?`<div class="empty" style="padding:14px">Mostrando 120 de ${prods.length}. Afina la búsqueda.</div>`:'');
}
function updateProdList(){
  let prods=S.cos;
  if(S.qs){const q=S.qs.toUpperCase();prods=prods.filter(p=>p.sku.toUpperCase().includes(q)||(p.producto||'').toUpperCase().includes(q)||(p.material||'').toUpperCase().includes(q));}
  const el=document.getElementById('prodlist');if(el)el.innerHTML=prodListH(prods);
}

let _tmp={sku:'',tipo:'Caja',qty:1};
function abrirAgregar(sku){
  const p=S.cos.find(x=>x.sku===sku);if(!p)return;
  _tmp={sku:sku,tipo:'Caja',qty:1};
  const hasPaq=p.precio_paq>0;
  const m=document.createElement('div');m.className='modal';m.id='addModal';
  m.onclick=e=>{if(e.target===m)cerrarModal();};
  m.innerHTML=`<div class="sheet">
    <h3>${esc(p.producto&&p.producto!==sku?p.producto:sku)}</h3>
    <div style="font-size:13px;color:var(--t3);margin-top:-8px;margin-bottom:12px">${esc([p.sku,p.medida,p.material].filter(Boolean).join(' · '))}</div>
    ${hasPaq?`<label class="lbl">Unidad</label>
    <div class="unitsel" id="unitsel">
      <button class="on" onclick="setUnit('Caja')">Caja · ${money(p.precio_caja)}</button>
      <button onclick="setUnit('Paquete')">Paquete · ${money(p.precio_paq)}</button>
    </div>`:`<div class="chip" style="margin-bottom:10px">Solo por caja · ${money(p.precio_caja)}</div>`}
    <div class="fld"><label class="lbl">Cantidad</label>
      <input class="inp" id="addQty" type="number" min="1" value="1" inputmode="numeric"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn btn-o" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-p" onclick="confirmAgregar()">Agregar al carrito</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  setTimeout(()=>document.getElementById('addQty').focus(),100);
}
function setUnit(t){_tmp.tipo=t;document.querySelectorAll('#unitsel button').forEach((b,i)=>b.classList.toggle('on',(t==='Caja')===(i===0)));}
function cerrarModal(){const m=document.getElementById('addModal');if(m)m.remove();}
function confirmAgregar(){
  const p=S.cos.find(x=>x.sku===_tmp.sku);if(!p)return;
  const qty=parseInt(document.getElementById('addQty').value)||0;
  if(qty<=0){toast('Cantidad inválida','err');return;}
  const esPaq=_tmp.tipo==='Paquete'&&p.precio_paq>0;
  const precio=esPaq?p.precio_paq:p.precio_caja;
  const pzUnit=esPaq?(p.pz_paq||0):(p.pz_caja|| (p.pz_paq&&p.paq_caja?p.pz_paq*p.paq_caja:0));
  const item={sku:p.sku,producto:p.producto,tipo:esPaq?'Paquete':'Caja',qty:qty,pz:pzUnit*qty,precio:precio,subtotal:Math.round(precio*qty*100)/100};
  S.cart.push(item);
  cerrarModal();toast('✅ Agregado al carrito','ok');R();
}

async function enviarCotizacion(){
  const c=S.cliente;
  if(!c.neg.trim()){toast('Falta el nombre del negocio','err');return;}
  if(S.cart.length===0){toast('El carrito está vacío','err');return;}
  if(c.email&&(c.email.indexOf('@')<0||c.email.indexOf('.')<0)){toast('Email inválido','err');return;}
  const total=S.cart.reduce((s,i)=>s+i.subtotal,0)*1.16;
  const dest=c.email?('\n📧 '+c.email):'\n(sin email — solo PDF)';
  if(!confirm('¿Generar cotización?'+dest+'\n\nTotal: '+money(total)))return;
  const b=document.getElementById('qbtn');b.disabled=true;b.innerHTML='<span class="spin"></span> Generando…';
  const r=await pf({
    action:'enviar_cotizacion',agente:S.u.id,
    negocio:c.neg,contacto:c.con,telefono:c.tel,email_cliente:c.email,rfc:c.rfc,
    items:JSON.stringify(S.cart)
  });
  if(r&&r.ok){
    mostrarResultadoCot(r,c.email);
    S.cart=[];S.cliente={neg:'',con:'',tel:'',email:'',rfc:''};R();
  }else{b.disabled=false;b.innerHTML='📄 Generar y enviar cotización';}
}
function mostrarResultadoCot(r,email){
  const m=document.createElement('div');m.className='modal';m.id='resModal';
  m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML=`<div class="sheet" style="text-align:center">
    <div style="font-size:44px">✅</div>
    <h3 style="justify-content:center">Cotización ${esc(r.folio)}</h3>
    <div style="font-family:'Saira';font-size:30px;font-weight:800;color:var(--navy);margin:4px 0">${money(r.total)}</div>
    <div style="font-size:13px;color:var(--t3);margin-bottom:16px">${r.emailEnviado?('Enviada por correo a '+esc(email)):'PDF generado (no se envió correo)'}</div>
    <a class="btn btn-v" href="${esc(r.pdfUrl)}" target="_blank" rel="noopener" style="text-decoration:none;margin-bottom:8px">📄 Abrir / descargar PDF</a>
    <button class="btn btn-p" onclick="document.getElementById('resModal').remove()">Listo</button>
  </div>`;
  document.body.appendChild(m);
}

/* ════════════════ CARTA ════════════════ */
let _carta={neg:'',con:'',email:'',tel:'',num:'',notas:''};
function cartaH(){
  _carta.num=_carta.num||S.u.id;
  return `
  <div class="card hero">
    <div class="eyebrow">Presentación</div>
    <h1 class="h-title">Carta personalizada</h1>
    <p class="h-sub">Materiales, certificación SEDEMA y tu firma. Lista para enviar.</p>
  </div>
  <div class="card">
    <div class="sec-t">📇 Datos del cliente</div>
    <div class="fld"><label class="lbl">Negocio *</label>
      <input class="inp" id="ca_neg" value="${esc(_carta.neg)}" oninput="_carta.neg=this.value" placeholder="Nombre del negocio"></div>
    <div class="g2">
      <div class="fld"><label class="lbl">Contacto</label>
        <input class="inp" id="ca_con" value="${esc(_carta.con)}" oninput="_carta.con=this.value" placeholder="Encargado"></div>
      <div class="fld"><label class="lbl">Teléfono</label>
        <input class="inp" id="ca_tel" type="tel" value="${esc(_carta.tel)}" oninput="_carta.tel=this.value" placeholder="55-0000-0000"></div>
    </div>
    <div class="fld"><label class="lbl">Email del cliente *</label>
      <input class="inp" id="ca_em" type="email" inputmode="email" value="${esc(_carta.email)}" oninput="_carta.email=this.value" placeholder="cliente@correo.com"></div>
  </div>
  <div class="card">
    <div class="sec-t">🪪 Tu firma</div>
    <div class="g2">
      <div class="fld"><label class="lbl">Asesor(a)</label>
        <input class="inp" value="${esc(S.u.nombre)}" disabled style="background:#EEF3F8;color:var(--t2)"></div>
      <div class="fld"><label class="lbl"># Agente</label>
        <input class="inp" id="ca_num" value="${esc(_carta.num)}" oninput="_carta.num=this.value"></div>
    </div>
    <div class="fld"><label class="lbl">Nota personal (opcional)</label>
      <textarea class="inp" id="ca_notas" oninput="_carta.notas=this.value" placeholder="Ej. Fue un gusto saludarle hoy en su local…">${esc(_carta.notas)}</textarea></div>
  </div>
  <div class="card">
    <button class="btn btn-p" id="cartaBtn" onclick="enviarCarta()">✉️ Enviar carta al cliente</button>
    <div style="font-size:11px;color:var(--t4);text-align:center;margin-top:8px">Incluye materiales, certificación, catálogo y datos bancarios. Copia al supervisor.</div>
  </div>`;
}
async function enviarCarta(){
  if(!_carta.neg.trim()){toast('Falta el negocio','err');return;}
  if(!_carta.email||_carta.email.indexOf('@')<0){toast('Email del cliente inválido','err');return;}
  const b=document.getElementById('cartaBtn');b.disabled=true;b.innerHTML='<span class="spin"></span> Enviando…';
  const r=await pf({action:'enviar_carta',agente:S.u.id,negocio:_carta.neg,contacto:_carta.con,
    telefono:_carta.tel,email_cliente:_carta.email,num_agente:_carta.num,notas:_carta.notas});
  if(r&&r.ok){toast('✅ Carta enviada','ok');_carta={neg:'',con:'',email:'',tel:'',num:S.u.id,notas:''};R();}
  else{b.disabled=false;b.innerHTML='✉️ Enviar carta al cliente';}
}

/* ════════════════ CATÁLOGO ════════════════ */
function catalogoH(){
  return `
  <div class="card">
    <div class="eyebrow">Catálogo de presentación</div>
    <h1 class="h-title">Hojéalo con el cliente</h1>
    <p class="h-sub" style="margin-bottom:12px">Pásalo en pantalla o compártelo por WhatsApp.</p>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <a class="btn btn-v btn-sm" href="${CATALOGO_URL}" target="_blank" rel="noopener" style="text-decoration:none;flex:1">🔗 Abrir completo</a>
      <button class="btn btn-p btn-sm" style="flex:1" onclick="compartirCat()">📲 Compartir</button>
    </div>
    <iframe class="flip" src="${CATALOGO_URL}" allowfullscreen loading="lazy"></iframe>
  </div>`;
}
function compartirCat(){
  const txt='Catálogo Entelequia · Desechables biodegradables para tu negocio:\n'+CATALOGO_URL;
  if(navigator.share){navigator.share({title:'Catálogo Entelequia',text:txt,url:CATALOGO_URL}).catch(()=>{});}
  else{navigator.clipboard.writeText(txt).then(()=>toast('✅ Link copiado','ok'));}
}

/* ════════════════ NOTAS ════════════════ */
function notasH(){
  return `
  <div class="card">
    <div class="eyebrow">Bloc</div>
    <h1 class="h-title">Tus notas</h1>
    <p class="h-sub" style="margin-bottom:12px">Pendientes, pedidos, recordatorios. Se guardan en este dispositivo.</p>
    <textarea class="inp" id="notasArea" style="min-height:340px" oninput="guardarNotas(this.value)" placeholder="• Llamar a Doña Rosa el viernes&#10;• Cano pidió muestra de vaso 16oz&#10;• Cobrar pedido Palman">${esc(S.notas)}</textarea>
    <div style="font-size:11px;color:var(--t4);margin-top:8px" id="notasState">Guardado automáticamente</div>
  </div>`;
}
function guardarNotas(v){S.notas=v;localStorage.setItem('closer_notas',v);const e=document.getElementById('notasState');if(e){e.textContent='Guardando…';clearTimeout(e._t);e._t=setTimeout(()=>e.textContent='✓ Guardado',500);}}

/* ════════════════ MÉTRICAS ════════════════ */
async function loadMetricas(){
  const r=await gf('metricas','&agente='+encodeURIComponent(S.u.id));
  if(r&&r.ok)S.met=r.metricas;
  const rc=await gf('cotizaciones','&agente='+encodeURIComponent(S.u.id));
  if(rc&&rc.ok)S.cots=rc.cotizaciones;
  if(S.v==='metricas')R();
}
function metricasH(){
  const isA=S.u.role==='admin';
  const m=S.met;
  if(!m)return `<div class="card"><div class="empty">Cargando métricas…</div></div>`;
  return `
  <div class="card hero">
    <div class="eyebrow">${isA?'Tablero del equipo':'Tu desempeño'}</div>
    <h1 class="h-title">${isA?'Cómo va la venta':'¡Vas '+(m.conversion>=30?'muy bien':'avanzando')+'!'}</h1>
    <p class="h-sub">${isA?'Cotizaciones de Elizabeth y cierre.':'Tu actividad y conversión.'}</p>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="kn">${m.hoy}</div><div class="kl">Cotizadas hoy</div></div>
    <div class="kpi"><div class="kn">${m.semana}</div><div class="kl">Esta semana</div></div>
    <div class="kpi blue"><div class="kn">${m.mes}</div><div class="kl">Este mes</div></div>
    <div class="kpi"><div class="kn">${m.cotizaciones}</div><div class="kl">Total histórico</div></div>
    <div class="kpi"><div class="kn">${m.conversion}%</div><div class="kl">Conversión</div></div>
    <div class="kpi blue"><div class="kn" style="font-size:19px">${money(m.montoGanado)}</div><div class="kl">Vendido (ganadas)</div></div>
  </div>
  <div class="card">
    <div class="sec-t">🧾 Cotizaciones recientes</div>
    ${S.cots.length===0?`<div class="empty">Aún no hay cotizaciones.</div>`:
      S.cots.slice(0,15).map(c=>`
      <div class="cartitem" style="flex-wrap:wrap">
        <div class="ci-info">
          <div class="ci-sku">${esc(c.negocio)}</div>
          <div class="ci-meta">${esc(c.folio)} · ${esc(String(c.fecha))}</div>
          <div class="ci-total">${money(c.total)}</div>
        </div>
        ${c.estatus==='Ganada'?`<span class="chip">✓ Ganada</span>`:
          c.estatus==='Perdida'?`<span class="chip" style="background:#FBEBE8;color:var(--rojo)">Perdida</span>`:`
          <div style="display:flex;gap:6px">
            <button class="btn btn-g btn-sm" onclick="estatus('${esc(c.folio)}','Ganada')">Ganada</button>
            <button class="btn btn-o btn-sm" onclick="estatus('${esc(c.folio)}','Perdida')">Perdida</button>
          </div>`}
        ${c.pdf?`<a href="${esc(c.pdf)}" target="_blank" rel="noopener" style="font-size:11px;color:var(--azul);font-weight:600;width:100%;margin-top:4px">📄 Ver PDF</a>`:''}
      </div>`).join('')}
  </div>`;
}
async function estatus(folio,est){
  const r=await pf({action:'marcar_estatus',folio:folio,estatus:est});
  if(r&&r.ok){toast('✅ '+est,'ok');loadMetricas();}
}
